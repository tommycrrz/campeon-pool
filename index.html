<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PELUSA</title>
<link rel="icon" type="image/png" href="logo.png">
<link rel="apple-touch-icon" href="logo.png">
<meta name="apple-mobile-web-app-title" content="PELUSA">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&display=swap">
<style>
:root{color-scheme:light;--bg:#ece3cf;--card:#fffaf0;--tinta:#2a1f14;--suave:#6d5d4a;--linea:#d3c6a6;
--verde:#1f6a38;--verdebtn:#2a7a43;--libre:#6b5a48;--ambar:#9a5f0f;--rojo:#8c2a24;--arena:#eadfc2;--bronce:#a8801f;--tot:#f7e9b8;--crema:#fffaf0;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tinta);font-family:"Anton",Impact,"Arial Narrow",sans-serif;font-weight:400;text-transform:uppercase;letter-spacing:.5px;font-size:20px;line-height:1.3;padding:14px}
h1{font-size:38px;font-weight:bold;letter-spacing:3px;text-transform:uppercase;margin:4px 0 2px;text-align:center;color:#000}
.resumen{font-size:18px;font-weight:bold;margin:6px 0 20px;text-align:center;color:var(--suave);padding-bottom:12px;border-bottom:3px double var(--bronce)}
button,input{font:inherit;text-transform:uppercase;letter-spacing:inherit}
*{font-weight:400!important}
button{border:2px solid var(--bronce);background:var(--arena);color:var(--tinta);border-radius:10px;min-height:52px;padding:6px 12px;font-weight:bold;cursor:pointer}
button:active{transform:scale(.97)}
.mesa{background:var(--card);border:3px solid var(--libre);border-radius:14px;margin-bottom:26px;overflow:hidden;box-shadow:0 2px 6px rgba(60,40,20,.25)}
.mesa.run{border-color:var(--verde)}
.mesa.pau{border-color:var(--ambar)}
.cab{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 14px;background:var(--libre);color:var(--crema)}
.mesa.run .cab{background:var(--verde)}
.mesa.pau .cab{background:var(--ambar)}
.cab h2{margin:0;font-size:26px}
.est{font-size:15px;font-weight:bold;border:2px solid var(--crema);border-radius:999px;padding:2px 12px;letter-spacing:.5px}
.sec{padding:14px;border-top:2px solid var(--linea)}
.cab+.sec{border-top:0}
.rot{font-size:14px;font-weight:bold;letter-spacing:1.5px;text-transform:uppercase;color:var(--suave);margin-bottom:8px}
.fila{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.precio{display:flex;align-items:center;gap:6px;flex:1;min-width:150px}
.precio span{font-size:24px;font-weight:bold}
input[type=number]{width:100%;min-width:0;font-size:24px;font-weight:bold;padding:6px 10px;border:2px solid var(--bronce);border-radius:8px;background:#fff;color:var(--tinta)}
.reloj{font-size:52px;font-weight:bold;text-align:center;font-variant-numeric:tabular-nums;line-height:1.1}
.sub{font-size:20px;font-weight:bold;text-align:center;margin-top:4px}
.grande{width:100%;min-height:62px;font-size:24px;margin-top:12px;background:var(--verdebtn);color:var(--crema);border-color:var(--verde)}
.grande.pausar{background:var(--rojo);border-color:var(--rojo)}
.dos{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.dos button{font-size:22px;min-height:56px}
.dos button.on{background:var(--verdebtn);color:var(--crema);border-color:var(--verde)}
.bebidas{display:flex;gap:10px;margin-top:12px}
.bebidas input{flex:1}
.bebidas button{background:var(--verdebtn);color:var(--crema);border-color:var(--verde);font-size:20px;min-width:110px}
.anotado{font-size:17px;margin:10px 0 0;word-break:break-word;color:var(--suave)}
.chico{font-size:16px;min-height:44px}
.bebtot{font-size:20px;font-weight:bold;margin-top:10px}
.total{background:var(--tot);border:2px solid var(--bronce);border-radius:10px;text-align:center;padding:8px}
.total small{display:block;font-size:16px;font-weight:bold;letter-spacing:1px}
.total b{font-size:52px;display:block;line-height:1.1}
.conf{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.conf p{grid-column:1/-1;margin:0;font-size:19px;font-weight:bold;text-align:center}
.conf .si{background:var(--rojo);color:var(--crema);border-color:var(--rojo)}
.liberar{width:100%;font-size:20px;min-height:58px}
.aviso{color:var(--rojo);font-weight:bold;font-size:16px;margin-top:8px}
.top{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:6px}
.top h1{grid-column:2}
.filtro{grid-column:3;justify-self:end;min-height:44px;font-size:16px;padding:4px 10px;background:var(--arena)}
.filtro.on{background:var(--verdebtn);color:var(--crema);border-color:var(--verde)}
.vacio{text-align:center;font-size:26px;color:var(--suave);padding:30px 0}
select{flex:1;min-width:0;font:inherit;text-transform:uppercase;letter-spacing:inherit;font-size:20px;min-height:52px;padding:6px 10px;border:2px solid var(--bronce);border-radius:8px;background:#fff;color:var(--tinta)}
input[type=text]{width:100%;min-width:0;font-size:24px;padding:6px 10px;border:2px solid var(--bronce);border-radius:8px;background:#fff;color:var(--tinta)}
@media (min-width:700px){
body{max-width:1500px;margin:0 auto;padding:20px 28px}
#mesas{display:grid;grid-template-columns:repeat(2,1fr);gap:22px;align-items:start}
#mesas>.mesa{margin-bottom:0}
#mesas>.vacio{grid-column:1/-1}
#mesas>.mesa:only-child{grid-column:1/-1;width:100%;max-width:640px;justify-self:center}
#adm,#reg{display:block;max-width:420px;margin-left:auto!important;margin-right:auto!important}
}
@media (min-width:1100px){#mesas{grid-template-columns:repeat(3,1fr)}}
/* Animaciones y microinteracciones */
@keyframes entra{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes suave{from{opacity:0;transform:translateY(-5px)}}
@keyframes tinte{from{background-color:var(--desde)}}
@keyframes borde{from{border-color:var(--desde)}}
@keyframes pop{from{transform:scale(.88)}}
@keyframes toast{0%{opacity:0;transform:translateY(12px)}10%,85%{opacity:1;transform:none}100%{opacity:0;transform:translateY(8px)}}
#mesas.anim>*{animation:entra .32s ease-out both}
#mesas.anim>*:nth-child(2){animation-delay:.03s}
#mesas.anim>*:nth-child(3){animation-delay:.06s}
#mesas.anim>*:nth-child(4){animation-delay:.09s}
#mesas.anim>*:nth-child(5){animation-delay:.12s}
#mesas.anim>*:nth-child(6){animation-delay:.15s}
#mesas.anim>*:nth-child(7){animation-delay:.18s}
#mesas.anim>*:nth-child(8){animation-delay:.21s}
#mesas.anim>*:nth-child(n+9){animation-delay:.24s}
.mesa.cambio{animation:borde .45s ease}
.mesa.cambio .cab{animation:tinte .45s ease}
.mesa.cambio .est{animation:pop .3s ease-out}
.mesa.cambio .sec+.sec{animation:suave .3s ease-out both}
.conf,.aviso{animation:suave .2s ease-out}
button{transition:transform .12s ease,filter .15s ease,box-shadow .15s ease}
@media (hover:hover){button:hover{filter:brightness(1.07);box-shadow:0 2px 6px rgba(60,40,20,.25)}}
button:active{filter:brightness(.95)}
input,select{transition:border-color .15s ease,box-shadow .15s ease}
input:focus,select:focus{outline:none;box-shadow:0 0 0 3px rgba(168,128,31,.35)}
#avisos{position:fixed;left:0;right:0;bottom:calc(16px + env(safe-area-inset-bottom,0px));display:flex;justify-content:center;padding:0 14px;pointer-events:none;z-index:50}
.toast{background:var(--tinta);color:var(--crema);border:2px solid var(--bronce);border-radius:10px;padding:10px 16px;font-size:18px;text-align:center;box-shadow:0 4px 12px rgba(0,0,0,.3);animation:toast 2.2s ease both}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>

</head>
<body>
<div class="top"><h1>CAMPEON</h1><button id="filtro" class="filtro">VER: TODAS</button></div>
<div class="resumen" id="resumen"></div>
<button id="adm" class="filtro" style="width:100%;font-size:20px;min-height:52px;margin:0 0 10px">ADMINISTRAR BEBIDAS</button>
<button id="reg" class="filtro" style="width:100%;font-size:20px;min-height:52px;margin:0 0 20px">REGISTRO DEL DÍA</button>
<div id="mesas"></div>
<div id="avisos" role="status" aria-live="polite"></div>

<script>
var NOMBRES=["Mesa 5","Mesa 6","Mesa 7","Mesa 8","Villa 1","Villa 2","Villa 3","Snooker","Carambola"];
var KEY="pelusa-mesas-v2",KEYR="pelusa-registro-v1",S={};
try{var g=localStorage.getItem(KEY);if(g){var p=JSON.parse(g);if(p&&typeof p==="object")S=p}}catch(e){}
var confirmando=null,filtro="todas",avisoMesa=null,vista="mesas",selBeb={},confBeb=null,avisoAdm="",pagoSel={};
var prevEst={},ANI={},DURN=450,tmrT=null,tmrE=null;
var KEYB="pelusa-bebidas-v1",BD=[];
try{var gb=localStorage.getItem(KEYB);if(gb){var pb=JSON.parse(gb);if(Array.isArray(pb))BD=pb}}catch(e){}
function guardar(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function M(n){
 if(!S[n])S[n]={precio:0,acc:0,start:null,pausada:false,bebSi:false,beb:[],ini:null,fin:null};
 return S[n];
}
function ms(m){return m.acc+(m.start?Math.max(0,Date.now()-m.start):0)}
function estado(m){return m.start?"run":(m.pausada?"pau":"libre")}
function pesos(v){return "$ "+Math.round(v).toLocaleString("es-AR")}
function dos(n){return (n<10?"0":"")+n}
function hora(t){try{return new Date(t).toLocaleTimeString("es-AR",{timeZone:"America/Argentina/Buenos_Aires",hour:"2-digit",minute:"2-digit",hourCycle:"h23"})}catch(e){return dos(new Date(t).getHours())+":"+dos(new Date(t).getMinutes())}}
function reloj(t){var s=Math.floor(t/1000),h=Math.floor(s/3600),mi=Math.floor(s%3600/60);return dos(h)+":"+dos(mi)+":"+dos(s%60)}
function bebTotal(m){return m.bebSi?m.beb.reduce(function(a,b){return a+(typeof b==="number"?b:b.p)},0):0}
function costoTiempo(m){return m.precio*ms(m)/3600000}

function norm(x){return typeof x==="number"?{n:"Otros",p:x}:x}
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]})}
function guardarB(){try{localStorage.setItem(KEYB,JSON.stringify(BD))}catch(e){}}
function opcionesBeb(n){return BD.map(function(x){return "<option value='"+esc(x.id)+"'"+(selBeb[n]===x.id?" selected":"")+">"+esc(x.nombre||"Sin nombre")+" — "+pesos(x.precio)+"</option>"}).join("")}
function lineasBeb(m){
 var G=[],ix={};
 m.beb.forEach(function(x,i){var o=norm(x),k=o.n+"|"+o.p;if(ix[k]===undefined){ix[k]=G.length;G.push({n:o.n,p:o.p,q:0,last:i})}var g=G[ix[k]];g.q++;g.last=i});
 if(!G.length)return "<div class='anotado'>Nada anotado todavía</div>";
 return G.map(function(g){return "<div class='fila' style='margin:8px 0'><span class='sub' style='text-align:left;margin:0'>"+g.q+" × "+esc(g.n)+" · "+pesos(g.q*g.p)+"</span><button class='chico' data-a='quitar' data-i='"+g.last+"'>QUITAR 1</button></div>"}).join("");
}
function administrar(){
 var c=document.getElementById("mesas");
 var h="<div class='mesa'><div class='cab'><h2>BEBIDAS</h2><span class='est'>"+BD.length+"</span></div>";
 h+="<div class='sec'><div class='rot'>Agregar bebida</div><input type='text' placeholder='NOMBRE' data-nn><div class='bebidas'><label class='precio'><span>$</span><input type='number' inputmode='numeric' min='0' placeholder='PRECIO' data-np></label><button data-a='adm-add'>AGREGAR</button></div>"+(avisoAdm?"<div class='aviso'>"+avisoAdm+"</div>":"")+"</div>";
 BD.forEach(function(x){
  h+="<div class='sec' data-id='"+esc(x.id)+"'><input type='text' value='"+esc(x.nombre)+"' placeholder='NOMBRE' data-bn>";
  h+=confBeb===x.id?"<div class='conf' style='margin-top:10px'><p>¿ELIMINAR ESTA BEBIDA?</p><button class='si' data-a='adm-si'>SÍ, ELIMINAR</button><button data-a='adm-no'>NO, VOLVER</button></div>":"<div class='fila' style='margin-top:10px'><label class='precio'><span>$</span><input type='number' inputmode='numeric' min='0' value='"+(x.precio||"")+"' placeholder='0' data-bp></label><button class='chico' data-a='adm-del'>ELIMINAR</button></div>";
  h+="</div>";
 });
 if(!BD.length)h+="<div class='sec'><div class='vacio' style='padding:10px 0'>TODAVÍA NO HAY BEBIDAS</div></div>";
 c.innerHTML=h+"</div>";
}
function olvidar(k){var s=ANI[k];if(s&&s.raf)cancelAnimationFrame(s.raf);delete ANI[k]}
function paso(k,now){var s=ANI[k];if(!s)return;var p=Math.max(0,Math.min(1,(now-s.t0)/DURN));s.shown=p>=1?s.to:s.from+(s.to-s.from)*(1-Math.pow(1-p,3));if(s.el&&s.el.isConnected)s.el.textContent=pesos(s.shown);if(p<1)s.raf=requestAnimationFrame(function(t){paso(k,t)});else s.raf=0}
function numero(el,v,k){
 var s=ANI[k];
 if(!s){ANI[k]={shown:v,to:v,raf:0,el:el};el.textContent=pesos(v);return}
 s.el=el;
 if(s.to!==v){
  s.to=v;
  if(Math.abs(v-s.shown)<2||(window.matchMedia&&window.matchMedia("(prefers-reduced-motion: reduce)").matches)){if(s.raf){cancelAnimationFrame(s.raf);s.raf=0}s.shown=v}
  else{s.from=s.shown;s.t0=performance.now();if(!s.raf)s.raf=requestAnimationFrame(function(t){paso(k,t)})}
 }
 el.textContent=pesos(s.shown);
}
function aviso(t){var c=document.getElementById("avisos");c.innerHTML="";var d=document.createElement("div");d.className="toast";d.textContent=t;c.appendChild(d);clearTimeout(tmrT);tmrT=setTimeout(function(){c.innerHTML=""},2300)}
function entrar(){var c=document.getElementById("mesas");c.classList.remove("anim");void c.offsetWidth;c.classList.add("anim");clearTimeout(tmrE);tmrE=setTimeout(function(){c.classList.remove("anim")},800)}
function dia(t){return new Date(t).toLocaleDateString("en-CA",{timeZone:"America/Argentina/Buenos_Aires"})}
function leer(){try{var r=JSON.parse(localStorage.getItem(KEYR));return Array.isArray(r)?r:[]}catch(e){return[]}}
function anotar(m,n){var r=leer(),lim=Date.now()-90*864e5;r.push({n:n,ini:m.ini,fin:m.fin,ms:ms(m),t:Math.round(costoTiempo(m)),b:bebTotal(m),it:m.bebSi?m.beb.map(norm):[],pago:pagoSel[n]||null,ts:Date.now()});r=r.filter(function(x){return x.ts>lim});try{localStorage.setItem(KEYR,JSON.stringify(r))}catch(e){}}
function fil(a,b){return "<div class='fila' style='margin:6px 0'><span class='rot' style='margin:0'>"+a+"</span><span class='sub' style='margin:0'>"+b+"</span></div>"}
function registro(){
 var c=document.getElementById("mesas"),hoy=dia(Date.now()),T=0,B=0;
 var L=leer().filter(function(x){return dia(x.ts)===hoy}).reverse();
 L.forEach(function(x){T+=x.t;B+=x.b});
 var PE=0,PT=0,PS=0;
 L.forEach(function(x){var s=x.t+x.b;if(x.pago==="efectivo")PE+=s;else if(x.pago==="transferencia")PT+=s;else PS+=s});
 var pagos="<div class='sec'><div class='rot'>Formas de pago</div>"+fil("Efectivo",pesos(PE))+fil("Transferencia",pesos(PT))+(PS?fil("Sin especificar",pesos(PS)):"")+"</div>";
 var A=Object.create(null),K=[];
 L.forEach(function(x){if(x.it&&x.it.length){x.it.forEach(function(i){if(!A[i.n]){A[i.n]={q:0,m:0};K.push(i.n)}A[i.n].q++;A[i.n].m+=i.p})}else if(x.b>0){var k="Sin detalle";if(!A[k]){A[k]={q:0,m:0};K.push(k)}A[k].m+=x.b}});
 K.sort();
 var vend=K.length?"<div class='sec'><div class='rot'>Bebidas vendidas</div>"+K.map(function(k){return fil(esc(k)+(A[k].q?" × "+A[k].q:""),pesos(A[k].m))}).join("")+fil("Total en bebidas",pesos(B))+"</div>":"";
 var f=new Date().toLocaleDateString("es-AR",{timeZone:"America/Argentina/Buenos_Aires",weekday:"long",day:"numeric",month:"long"});
 var h="<div class='mesa run'><div class='cab'><h2>HOY</h2><span class='est'>"+f+"</span></div><div class='sec'><div class='total'><small>TOTAL DEL DÍA</small><b>"+pesos(T+B)+"</b></div></div><div class='sec'>"+fil("Mesas cobradas",L.length)+fil("Tiempo de mesas",pesos(T))+fil("Bebidas",pesos(B))+"</div>"+pagos+vend+"</div>";
 if(!L.length)h+="<div class='vacio'>TODAVÍA NO SE COBRÓ NINGUNA MESA HOY</div>";
 L.forEach(function(x){h+="<div class='mesa'><div class='cab'><h2>"+x.n+"</h2><span class='est' style='font-size:20px'>"+pesos(x.t+x.b)+"</span></div><div class='sec'>"+fil("Entró",x.ini?hora(x.ini):"--:--")+fil("Salió",x.fin?hora(x.fin):"--:--")+fil("Tiempo jugado",reloj(x.ms))+fil("Tiempo",pesos(x.t))+fil("Bebidas",pesos(x.b))+(x.pago?fil("Pago",x.pago==="efectivo"?"Efectivo":"Transferencia"):"")+"</div></div>"});
 c.innerHTML=h;
}
function dibujar(){
 document.getElementById("mesas").classList.remove("anim");
 if(vista==="registro"){registro();return}
 if(vista==="admin"){administrar();return}
 var c=document.getElementById("mesas");c.innerHTML="";var bt=document.getElementById("filtro");bt.textContent="VER: "+filtro.toUpperCase();bt.className="filtro"+(filtro==="todas"?"":" on");if(filtro!=="todas"&&!NOMBRES.some(function(n){var e=estado(M(n));return filtro==="ocupadas"?e!=="libre":e==="libre"})){c.innerHTML="<div class='vacio'>NO HAY MESAS "+filtro.toUpperCase()+"</div>"}
 NOMBRES.forEach(function(n){
  var m=M(n),e=estado(m),d=document.createElement("div");
  if((filtro==="ocupadas"&&e==="libre")||(filtro==="libres"&&e!=="libre"))return;
  d.className="mesa "+e;d.setAttribute("data-n",n);
  var pe=prevEst[n];if(pe&&pe!==e){d.classList.add("cambio");d.style.setProperty("--desde",pe==="run"?"var(--verde)":pe==="pau"?"var(--ambar)":"var(--libre)")}prevEst[n]=e;
  var h="<div class='cab'><h2>"+n+"</h2><span class='est'>"+(e==="run"?"CORRIENDO":e==="pau"?"PAUSADA":"LIBRE")+"</span></div>";
  h+="<div class='sec'><div class='rot'>Precio por hora</div><label class='precio'><span>$</span><input type='number' inputmode='numeric' min='0' value='"+(m.precio||"")+"' placeholder='0' data-p></label>";
  if(e==="libre"){
   if(avisoMesa===n&&!(m.precio>0))h+="<div class='aviso'>PRIMERO INGRESÁ EL PRECIO POR HORA</div>";
   h+="<button class='grande' data-a='empezar'>▶ EMPEZAR</button></div>";
  }else{
   h+="</div><div class='sec'><div class='fila' style='align-items:flex-start;margin-bottom:8px'><div class='rot' style='margin:0'>Tiempo jugado</div>"+(m.ini?"<div class='rot' style='margin:0;text-align:right;font-size:16px;color:var(--tinta)'>ENTRÓ: "+hora(m.ini)+(m.fin?"<br>SALIÓ: "+hora(m.fin):"")+"</div>":"")+"</div><div class='reloj' data-r></div><div class='sub'>Tiempo: <span data-ct></span></div>";
   h+=e==="run"?"<button class='grande pausar' data-a='pausar'>⏸ PAUSAR / COBRAR</button>":"<button class='grande' data-a='seguir'>▶ SEGUIR JUGANDO</button>";
   h+="</div><div class='sec'><div class='rot'>¿Tomaron bebida?</div><div class='dos'><button data-a='bno' class='"+(m.bebSi?"":"on")+"'>NO</button><button data-a='bsi' class='"+(m.bebSi?"on":"")+"'>SÍ</button></div>";
   if(m.bebSi){
    h+=BD.length?"<div class='bebidas'><select data-s>"+opcionesBeb(n)+"</select><button data-a='agregar'>AGREGAR</button></div>":"<div class='aviso'>NO HAY BEBIDAS CARGADAS. CARGALAS EN ADMINISTRAR BEBIDAS.</div>";
    h+=lineasBeb(m);
    h+="<div class='fila'><span class='bebtot'>Bebidas: "+pesos(bebTotal(m))+"</span>"+"</div>";
   }
   h+="</div><div class='sec'><div class='total'><small>TOTAL A COBRAR</small><b data-t></b></div></div>";
   if(confirmando===n){
    h+=!pagoSel[n]?"<div class='sec'><div class='conf'><p>¿CÓMO PAGARON?</p><button style='background:var(--verdebtn);color:var(--crema);border-color:var(--verde)' data-a='pagoe'>EFECTIVO</button><button style='background:var(--verdebtn);color:var(--crema);border-color:var(--verde)' data-a='pagot'>TRANSFERENCIA</button><button style='grid-column:1/-1' data-a='no'>NO, VOLVER</button></div></div>":"<div class='sec'><div class='conf'><p>PAGO: "+(pagoSel[n]==="efectivo"?"EFECTIVO":"TRANSFERENCIA")+"</p><p>¿Liberar la mesa? Se borra esta cuenta.</p><button class='si' data-a='si'>SÍ, LIBERAR</button><button data-a='no'>NO, VOLVER</button></div></div>";
   }else if(e==="pau"){
    h+="<div class='sec'><button class='liberar' data-a='liberar'>✔ PAGARON · DEJAR MESA LIBRE</button></div>";
   }
  }
  d.innerHTML=h;c.appendChild(d);
 });
 tick();
}
function tick(){
 var corr=0,libres=0;
 NOMBRES.forEach(function(n){
  var m=M(n),e=estado(m);
  if(e==="run")corr++;if(e==="libre")libres++;
  var d=document.querySelector("[data-n='"+n+"']");if(!d){olvidar(n);return}
  var r=d.querySelector("[data-r]");if(!r){olvidar(n);return}
  r.textContent=reloj(ms(m));
  d.querySelector("[data-ct]").textContent=pesos(costoTiempo(m));
  numero(d.querySelector("[data-t]"),Math.round(costoTiempo(m)+bebTotal(m)),n);
 });
 document.getElementById("resumen").textContent="Corriendo: "+corr+"  ·  Libres: "+libres;
}
document.getElementById("mesas").addEventListener("change",function(ev){if(ev.target.hasAttribute("data-s")){selBeb[ev.target.closest("[data-n]").getAttribute("data-n")]=ev.target.value}});
document.getElementById("mesas").addEventListener("input",function(ev){
 var t=ev.target;
 if(t.hasAttribute("data-bn")||t.hasAttribute("data-bp")){var id=t.closest("[data-id]").getAttribute("data-id"),bd=BD.filter(function(x){return x.id===id})[0];if(bd){if(t.hasAttribute("data-bn"))bd.nombre=t.value;else bd.precio=Math.max(0,parseFloat(t.value)||0);guardarB()}return}
 if(ev.target.hasAttribute("data-p")){
  var n=ev.target.closest("[data-n]").getAttribute("data-n"),m=M(n);
  m.precio=Math.max(0,parseFloat(ev.target.value)||0);guardar();tick();
  if(m.precio>0){avisoMesa=null;var av=ev.target.closest("[data-n]").querySelector(".aviso");if(av)av.remove()}
 }
});
document.getElementById("mesas").addEventListener("click",function(ev){
 var b=ev.target.closest("[data-a]");if(!b)return;
 var a0=b.getAttribute("data-a");
 if(a0.indexOf("adm-")===0){
  if(a0==="adm-add"){var nn=document.querySelector("[data-nn]").value.trim(),np=parseFloat(document.querySelector("[data-np]").value);if(!nn||!(np>0)){avisoAdm="ESCRIBÍ EL NOMBRE Y EL PRECIO"}else{BD.push({id:Date.now().toString(36)+Math.random().toString(36).slice(2,5),nombre:nn,precio:np});guardarB();avisoAdm=""}}
  else{var id=b.closest("[data-id]").getAttribute("data-id");if(a0==="adm-del")confBeb=id;else if(a0==="adm-no")confBeb=null;else if(a0==="adm-si"){BD=BD.filter(function(x){return x.id!==id});guardarB();confBeb=null}}
  administrar();return;
 }
 var d=b.closest("[data-n]"),n=d.getAttribute("data-n"),m=M(n),a=b.getAttribute("data-a");
 var msg="";
 if(a==="empezar"){if(!(m.precio>0)){avisoMesa=n;dibujar();return}avisoMesa=null;msg="Mesa iniciada correctamente";m.acc=0;m.start=Date.now();m.ini=m.start;m.fin=null;m.pausada=false;m.bebSi=false;m.beb=[]}
 else if(a==="pausar"){m.acc=ms(m);m.fin=Date.now();m.start=null;m.pausada=true;msg="Mesa pausada"}
 else if(a==="seguir"){m.fin=null;m.start=Date.now();m.pausada=false;confirmando=null}
 else if(a==="bsi")m.bebSi=true;
 else if(a==="bno")m.bebSi=false;
 else if(a==="sumar"){var v=parseFloat(d.querySelector("[data-b]").value);if(!(v>0))return;m.beb.push(v)}
 else if(a==="agregar"){var sv=d.querySelector("[data-s]");if(!sv)return;var bd=BD.filter(function(x){return x.id===sv.value})[0];if(!bd)return;m.beb.push({n:bd.nombre||"Sin nombre",p:bd.precio});selBeb[n]=bd.id;msg="Bebida agregada"}
 else if(a==="quitar"){var qi=parseInt(b.getAttribute("data-i"),10);if(qi>=0&&qi<m.beb.length){m.beb.splice(qi,1);msg="Bebida eliminada"}}
 else if(a==="undo")m.beb.pop();
 else if(a==="liberar"){confirmando=n;pagoSel[n]=null}
 else if(a==="pagoe")pagoSel[n]="efectivo";
 else if(a==="pagot")pagoSel[n]="transferencia";
 else if(a==="no"){confirmando=null;pagoSel[n]=null}
 else if(a==="si"){if(!pagoSel[n])return;msg="Pago registrado correctamente";anotar(m,n);pagoSel[n]=null;m.ini=null;m.fin=null;m.acc=0;m.start=null;m.pausada=false;m.bebSi=false;m.beb=[];confirmando=null}
 guardar();dibujar();if(msg)aviso(msg);
});
document.addEventListener("visibilitychange",function(){if(!document.hidden)tick()});
window.addEventListener("focus",tick);
setInterval(tick,1000);
function nav(v){vista=vista===v?"mesas":v;confirmando=null;confBeb=null;avisoAdm="";var r=document.getElementById("reg"),a=document.getElementById("adm");r.textContent=vista==="registro"?"VOLVER A LAS MESAS":"REGISTRO DEL DÍA";a.textContent=vista==="admin"?"VOLVER A LAS MESAS":"ADMINISTRAR BEBIDAS";r.style.display=vista==="admin"?"none":"";a.style.display=vista==="registro"?"none":"";document.getElementById("filtro").style.visibility=vista==="mesas"?"visible":"hidden";dibujar();entrar()}
document.getElementById("reg").addEventListener("click",function(){nav("registro")});
document.getElementById("adm").addEventListener("click",function(){nav("admin")});
document.getElementById("filtro").addEventListener("click",function(){filtro=filtro==="todas"?"ocupadas":filtro==="ocupadas"?"libres":"todas";confirmando=null;dibujar();entrar()});
dibujar();entrar();
</script>
