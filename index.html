<html lang="es">
<head>

<style>
:root{color-scheme:light;--bg:#ece3cf;--card:#fffaf0;--tinta:#2a1f14;--suave:#5a4a37;--linea:#d3c6a6;
--verde:#1f6a38;--verdebtn:#2a7a43;--libre:#6b5a48;--ambar:#9a5f0f;--rojo:#8c2a24;--arena:#eadfc2;--bronce:#a8801f;--tot:#f7e9b8;--crema:#fffaf0;
--nav:#3a2417;--navact:#c9a24b;
--f-titulo:"Anton",Impact,"Arial Narrow",sans-serif;--f-texto:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tinta);font-family:var(--f-texto);font-weight:400;font-size:17px;line-height:1.35;padding:14px}
h1,h2{font-family:var(--f-titulo);font-weight:400}
h1{font-size:44px;letter-spacing:4px;text-transform:uppercase;margin:4px 0 2px;text-align:center;color:#000}
.resumen{font-size:15px;font-weight:600;margin:6px 0 4px;text-align:center;color:var(--suave);padding-bottom:12px;border-bottom:3px double var(--bronce)}
button,input,select{font-family:var(--f-texto)}
button{border:2px solid var(--bronce);background:var(--arena);color:var(--tinta);border-radius:10px;min-height:50px;padding:6px 14px;font-size:15px;font-weight:700;letter-spacing:.4px;text-transform:uppercase;cursor:pointer}
button:active{transform:scale(.97)}
.menu{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;position:sticky;top:0;z-index:20;background:var(--bg);padding:12px 0 14px}
.nv{background:var(--nav);color:var(--crema);border-color:var(--bronce);min-height:56px;font-size:14px;letter-spacing:.7px}
.nv.act{background:var(--navact);color:var(--tinta);border-color:var(--navact);box-shadow:inset 0 -4px 0 rgba(42,31,20,.35)}
.mesa{background:var(--card);border:3px solid var(--libre);border-radius:14px;margin-bottom:26px;overflow:hidden;box-shadow:0 2px 6px rgba(60,40,20,.25)}
.mesa.run{border-color:var(--verde)}
.mesa.pau{border-color:var(--ambar)}
.cab{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 16px;background:var(--libre);color:var(--crema)}
.mesa.run .cab{background:var(--verde)}
.mesa.pau .cab{background:var(--ambar)}
.cab h2{margin:0;font-size:28px;letter-spacing:.6px;text-transform:uppercase}
.est{font-size:13px;font-weight:700;border:2px solid var(--crema);border-radius:999px;padding:2px 12px;letter-spacing:.5px;text-transform:uppercase}
.sec{padding:16px;border-top:2px solid var(--linea)}
.cab+.sec{border-top:0}
.rot{font-size:12px;font-weight:700;letter-spacing:1.2px;text-transform:uppercase;color:var(--suave);margin-bottom:8px}
.fila{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.precio{display:flex;align-items:center;gap:6px;flex:1;min-width:150px}
.precio span{font-size:20px;font-weight:700}
input[type=number],input[type=text],input[type=date]{width:100%;min-width:0;font-size:18px;font-weight:600;padding:9px 12px;border:2px solid var(--bronce);border-radius:8px;background:#fff;color:var(--tinta)}
.reloj{font-size:48px;font-weight:800;text-align:center;font-variant-numeric:tabular-nums;letter-spacing:-1px;line-height:1.1}
.sub{font-size:18px;font-weight:700;text-align:center;margin-top:4px}
.oculto{display:none}
.grande{width:100%;min-height:60px;font-size:19px;margin-top:12px;background:var(--verdebtn);color:var(--crema);border-color:var(--verde)}
.grande.pausar{background:var(--rojo);border-color:var(--rojo)}
.dos{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.dos button{font-size:16px;min-height:52px}
.dos button.on{background:var(--verdebtn);color:var(--crema);border-color:var(--verde)}
.bebidas{display:flex;gap:10px;margin-top:12px}
.bebidas input{flex:1}
.bebidas button{background:var(--verdebtn);color:var(--crema);border-color:var(--verde);font-size:15px;min-width:110px}
.anotado{font-size:15px;font-weight:500;margin:10px 0 0;word-break:break-word;color:var(--suave);line-height:1.5}
.chico{font-size:13px;min-height:44px}
.bebtot{font-size:18px;font-weight:700;margin-top:10px}
.total{background:var(--tot);border:2px solid var(--bronce);border-radius:10px;text-align:center;padding:8px}
.total small{display:block;font-size:12px;font-weight:700;letter-spacing:1.2px;text-transform:uppercase}
.total b{font-size:44px;font-weight:800;display:block;line-height:1.1;font-variant-numeric:tabular-nums}
.conf{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.conf p{grid-column:1/-1;margin:0;font-size:17px;font-weight:700;text-align:center}
.conf .si{background:var(--rojo);color:var(--crema);border-color:var(--rojo)}
.liberar{width:100%;font-size:16px;min-height:56px}
.aviso{color:var(--rojo);font-weight:700;font-size:14px;margin-top:8px}
.top{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:6px}
.top h1{grid-column:2}
.filtro{grid-column:3;justify-self:end;min-height:42px;font-size:13px;padding:4px 12px;background:var(--arena)}
.filtro.on{background:var(--verdebtn);color:var(--crema);border-color:var(--verde)}
.vacio{text-align:center;font-size:20px;font-weight:600;color:var(--suave);padding:30px 0}
select{flex:1;min-width:0;width:100%;font-size:16px;font-weight:600;min-height:46px;padding:6px 10px;border:2px solid var(--bronce);border-radius:8px;background:#fff;color:var(--tinta)}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px;align-items:start}
.itm{display:grid;grid-template-columns:1fr 1fr;gap:10px 14px;align-items:end;margin-bottom:14px;padding-bottom:14px;border-bottom:1px dashed var(--linea)}
@media (min-width:700px){
body{max-width:1680px;margin:0 auto;padding:20px 32px}
#mesas{display:grid;grid-template-columns:repeat(2,1fr);gap:24px;align-items:start}
#mesas>.mesa{margin-bottom:0}
#mesas>.vacio{grid-column:1/-1}
#mesas>.mesa:only-child{grid-column:1/-1;width:100%;max-width:640px;justify-self:center}
#mesas>.mesa.ancho{max-width:1250px}
}
@media (min-width:900px){.itm{grid-template-columns:2fr 1.6fr 1fr 1fr 1.1fr 1.1fr auto}}
@media (min-width:1100px){#mesas{grid-template-columns:repeat(3,1fr)}}
/* Animaciones y microinteracciones */
@keyframes entra{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes suave{from{opacity:0;transform:translateY(-5px)}}
@keyframes tinte{from{background-color:var(--desde)}}
@keyframes borde{from{border-color:var(--desde)}}
@keyframes pop{from{transform:scale(.88)}}
@keyframes toast{0%{opacity:0;transform:translateY(12px)}10%,85%{opacity:1;transform:none}100%{opacity:0;transform:translateY(8px)}}
#mesas.anim>*{animation:entra .32s ease-out both}
#mesas.anim>*:nth-child(2){animation-delay:.03s}
#mesas.anim>*:nth-child(3){animation-delay:.06s}
#mesas.anim>*:nth-child(4){animation-delay:.09s}
#mesas.anim>*:nth-child(5){animation-delay:.12s}
#mesas.anim>*:nth-child(6){animation-delay:.15s}
#mesas.anim>*:nth-child(7){animation-delay:.18s}
#mesas.anim>*:nth-child(8){animation-delay:.21s}
#mesas.anim>*:nth-child(n+9){animation-delay:.24s}
.mesa.cambio{animation:borde .45s ease}
.mesa.cambio .cab{animation:tinte .45s ease}
.mesa.cambio .est{animation:pop .3s ease-out}
.mesa.cambio .sec+.sec{animation:suave .3s ease-out both}
.conf,.aviso{animation:suave .2s ease-out}
button{transition:transform .12s ease,filter .15s ease,box-shadow .15s ease}
@media (hover:hover){button:hover{filter:brightness(1.07);box-shadow:0 2px 6px rgba(60,40,20,.25)}}
button:active{filter:brightness(.95)}
input,select{transition:border-color .15s ease,box-shadow .15s ease}
input:focus,select:focus{outline:none;box-shadow:0 0 0 3px rgba(168,128,31,.35)}
#avisos{position:fixed;left:0;right:0;bottom:calc(16px + env(safe-area-inset-bottom,0px));display:flex;justify-content:center;padding:0 14px;pointer-events:none;z-index:50}
.toast{background:var(--tinta);color:var(--crema);border:2px solid var(--bronce);border-radius:10px;padding:10px 16px;font-size:18px;text-align:center;box-shadow:0 4px 12px rgba(0,0,0,.3);animation:toast 2.2s ease both}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
button:disabled{opacity:.4;pointer-events:none}
.toast{font-family:var(--f-texto);font-weight:600;font-size:16px}
</style>

</head>
<body>
<div class="top"><h1>CAMPEON</h1><button id="filtro" class="filtro">VER: TODAS</button></div>
<div class="resumen" id="resumen"></div>
<div id="menu" class="menu">
<button class="nv act" id="mes">MESAS</button>

<input type="file" id="arch" accept=".json,application/json" style="display:none">

<script>
var NOMBRES=["Mesa 5","Mesa 6","Mesa 7","Mesa 8","Villa 1","Villa 2","Villa 3","Snooker","Carambola"];
var KEY="pelusa-mesas-v2",KEYR="pelusa-registro-v1",S={};
try{var g=localStorage.getItem(KEY);if(g){var p=JSON.parse(g);if(p&&typeof p==="object")S=p}}catch(e){}
var confirmando=null,filtro="todas",avisoMesa=null,vista="mesas",selBeb={},confBeb=null,avisoAdm="",pagoSel={};
var diaSel=null,cobrando=null,avisoDeu=null,pend={},prevEst={},ANI={},DURN=450,tmrT=null,tmrE=null;
var KEYB="pelusa-bebidas-v1",BD=[],KEYD="pelusa-deudas-v1",DD=[],KEYG="pelusa-grupos-v1",GG=[],gw=null,cobG=null,delG=null,stkForm=null,KEYS="pelusa-stock-v1",MOV=[],KEYC="pelusa-compras-v1",CC=[],cw=null,compraDel=null;
try{var cc0=localStorage.getItem(KEYC);if(cc0){var pcc=JSON.parse(cc0);if(Array.isArray(pcc))CC=pcc}}catch(e){}
try{var sv0=localStorage.getItem(KEYS);if(sv0){var psv=JSON.parse(sv0);if(Array.isArray(psv))MOV=psv}}catch(e){}
try{var gg0=localStorage.getItem(KEYG);if(gg0){var pgg=JSON.parse(gg0);if(Array.isArray(pgg))GG=pgg}}catch(e){}
try{var gd=localStorage.getItem(KEYD);if(gd){var pdd=JSON.parse(gd);if(Array.isArray(pdd))DD=pdd}}catch(e){}
try{var gb=localStorage.getItem(KEYB);if(gb){var pb=JSON.parse(gb);if(Array.isArray(pb))BD=pb}}catch(e){}
function guardar(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function M(n){
 if(!S[n])S[n]={precio:0,acc:0,start:null,pausada:false,bebSi:false,beb:[],ini:null,fin:null};
 return S[n];
}
function ms(m){return m.acc+(m.start?Math.max(0,Date.now()-m.start):0)}
function estado(m){return m.start?"run":(m.pausada?"pau":"libre")}
function pesos(v){return "$ "+Math.round(v).toLocaleString("es-AR")}
function dos(n){return (n<10?"0":"")+n}
function hora(t){try{return new Date(t).toLocaleTimeString("es-AR",{timeZone:"America/Argentina/Buenos_Aires",hour:"2-digit",minute:"2-digit",hourCycle:"h23"})}catch(e){return dos(new Date(t).getHours())+":"+dos(new Date(t).getMinutes())}}
function reloj(t){var s=Math.floor(t/1000),h=Math.floor(s/3600),mi=Math.floor(s%3600/60);return dos(h)+":"+dos(mi)+":"+dos(s%60)}
function bebTotal(m){return m.bebSi?m.beb.reduce(function(a,b){return a+(typeof b==="number"?b:b.p)},0):0}
function bloques(m){return Math.max(1,Math.ceil(ms(m)/900000))}
function costoTiempo(m){return m.precio*bloques(m)/4}

function norm(x){return typeof x==="number"?{n:"Otros",p:x}:x}
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]})}
function guardarB(){try{localStorage.setItem(KEYB,JSON.stringify(BD))}catch(e){}}
function opcionesBeb(n){return BD.map(function(x){return "<option value='"+esc(x.id)+"'"+(selBeb[n]===x.id?" selected":"")+">"+esc(x.nombre||"Sin nombre")+" — "+pesos(x.precio)+(typeof x.stock==="number"?(x.stock>0?" · QUEDAN "+x.stock:" · SIN STOCK"):"")+"</option>"}).join("")}
function lineasBeb(m){
 var G=[],ix={};
 m.beb.forEach(function(x,i){var o=norm(x),k=o.n+"|"+o.p;if(ix[k]===undefined){ix[k]=G.length;G.push({n:o.n,p:o.p,q:0,last:i})}var g=G[ix[k]];g.q++;g.last=i});
 if(!G.length)return "<div class='anotado'>Nada anotado todavía</div>";
 return G.map(function(g){return "<div class='fila' style='margin:8px 0'><span class='sub' style='text-align:left;margin:0'>"+g.q+" × "+esc(g.n)+" · "+pesos(g.q*g.p)+"</span><button class='chico' data-a='quitar' data-i='"+g.last+"'>QUITAR 1</button></div>"}).join("");
}
function administrar(){
 var c=document.getElementById("mesas");
 var h="<div class='mesa'><div class='cab'><h2>BEBIDAS</h2><span class='est'>"+BD.length+"</span></div>";
 h+="<div class='sec'><div class='rot'>Agregar bebida</div><input type='text' placeholder='NOMBRE' data-nn><div class='bebidas'><label class='precio'><span>$</span><input type='number' inputmode='numeric' min='0' placeholder='PRECIO' data-np></label><button data-a='adm-add'>AGREGAR</button></div>"+(avisoAdm?"<div class='aviso'>"+avisoAdm+"</div>":"")+"</div>";
 BD.forEach(function(x){
  h+="<div class='sec' data-id='"+esc(x.id)+"'><input type='text' value='"+esc(x.nombre)+"' placeholder='NOMBRE' data-bn>";
  h+=confBeb===x.id?"<div class='conf' style='margin-top:10px'><p>¿ELIMINAR ESTA BEBIDA?</p><button class='si' data-a='adm-si'>SÍ, ELIMINAR</button><button data-a='adm-no'>NO, VOLVER</button></div>":"<div class='fila' style='margin-top:10px'><label class='precio'><span>$</span><input type='number' inputmode='numeric' min='0' value='"+(x.precio||"")+"' placeholder='0' data-bp></label><button class='chico' data-a='adm-del'>ELIMINAR</button></div>";
  h+="</div>";
 });
 if(!BD.length)h+="<div class='sec'><div class='vacio' style='padding:10px 0'>TODAVÍA NO HAY BEBIDAS</div></div>";
 c.innerHTML=h+"</div>";
}
function olvidar(k){var s=ANI[k];if(s&&s.raf)cancelAnimationFrame(s.raf);delete ANI[k]}
function paso(k,now){var s=ANI[k];if(!s)return;var p=Math.max(0,Math.min(1,(now-s.t0)/DURN));s.shown=p>=1?s.to:s.from+(s.to-s.from)*(1-Math.pow(1-p,3));if(s.el&&s.el.isConnected)s.el.textContent=pesos(s.shown);if(p<1)s.raf=requestAnimationFrame(function(t){paso(k,t)});else s.raf=0}
function numero(el,v,k){
 var s=ANI[k];
 if(!s){ANI[k]={shown:v,to:v,raf:0,el:el};el.textContent=pesos(v);return}
 s.el=el;
 if(s.to!==v){
  s.to=v;
  if(Math.abs(v-s.shown)<2||(window.matchMedia&&window.matchMedia("(prefers-reduced-motion: reduce)").matches)){if(s.raf){cancelAnimationFrame(s.raf);s.raf=0}s.shown=v}
  else{s.from=s.shown;s.t0=performance.now();if(!s.raf)s.raf=requestAnimationFrame(function(t){paso(k,t)})}
 }
 el.textContent=pesos(s.shown);
}
function aviso(t){var c=document.getElementById("avisos");c.innerHTML="";var d=document.createElement("div");d.className="toast";d.textContent=t;c.appendChild(d);clearTimeout(tmrT);tmrT=setTimeout(function(){c.innerHTML=""},2300)}
function entrar(){var c=document.getElementById("mesas");c.classList.remove("anim");void c.offsetWidth;c.classList.add("anim");clearTimeout(tmrE);tmrE=setTimeout(function(){c.classList.remove("anim")},800)}
function mover(s,d){return new Date(new Date(s+"T12:00:00Z").getTime()+d*864e5).toISOString().slice(0,10)}
function exportar(){
 var datos={app:"campeon",version:1,fecha:new Date().toISOString(),bebidas:BD,registro:leer(),deudas:DD,grupos:GG,stock:MOV,compras:CC};
 var txt=JSON.stringify(datos),nombre="campeon-copia-"+dia(Date.now())+".json",f=null;
 try{f=new File([txt],nombre,{type:"application/json"})}catch(e){}
 if(f&&navigator.canShare&&navigator.canShare({files:[f]})){navigator.share({files:[f],title:"Copia de CAMPEON"}).catch(function(){});return}
 try{var u=URL.createObjectURL(new Blob([txt],{type:"application/json"})),a=document.createElement("a");a.href=u;a.download=nombre;document.body.appendChild(a);a.click();a.remove();setTimeout(function(){URL.revokeObjectURL(u)},1500);aviso("Copia guardada")}catch(e){aviso("No se pudo guardar la copia")}
}
function importar(txt){
 try{
  var d=JSON.parse(txt);
  if(!d||d.app!=="campeon"||!Array.isArray(d.registro)||!Array.isArray(d.bebidas))throw 0;
  var R=leer(),ya={},nr=0,ids={};
  R.forEach(function(x){ya[x.ts+"|"+x.n]=1});
  d.registro.forEach(function(x){
   if(!x||typeof x.ts!=="number"||typeof x.n!=="string"||typeof x.t!=="number"||typeof x.b!=="number"||ya[x.ts+"|"+x.n])return;
   ya[x.ts+"|"+x.n]=1;nr++;
   R.push({n:x.n,ini:typeof x.ini==="number"?x.ini:null,fin:typeof x.fin==="number"?x.fin:null,ms:typeof x.ms==="number"?x.ms:0,t:x.t,b:x.b,
    it:Array.isArray(x.it)?x.it.filter(function(i){return i&&typeof i.n==="string"&&typeof i.p==="number"}):[],
    pago:x.pago==="efectivo"||x.pago==="transferencia"||x.pago==="pendiente"?x.pago:null,deu:x.deu&&typeof x.deu.nombre==="string"?{nombre:x.deu.nombre}:undefined,ts:x.ts});
  });
  BD.forEach(function(x){ids[x.id]=1});
  d.bebidas.forEach(function(x){if(x&&typeof x.id==="string"&&typeof x.nombre==="string"&&typeof x.precio==="number"&&!ids[x.id]){ids[x.id]=1;BD.push({id:x.id,nombre:x.nombre,precio:x.precio,stock:typeof x.stock==="number"?x.stock:null})}});
  if(Array.isArray(d.deudas)){var di={};DD.forEach(function(x){di[x.id]=1});d.deudas.forEach(function(x){if(x&&typeof x.id==="string"&&typeof x.nombre==="string"&&typeof x.monto==="number"&&typeof x.ts==="number"&&!di[x.id]){di[x.id]=1;DD.push({id:x.id,nombre:x.nombre,tel:typeof x.tel==="string"?x.tel:"",nota:typeof x.nota==="string"?x.nota:"",mesa:typeof x.mesa==="string"?x.mesa:"",monto:x.monto,ts:x.ts,pagada:!!x.pagada,metodo:x.metodo==="efectivo"||x.metodo==="transferencia"?x.metodo:null,pts:typeof x.pts==="number"?x.pts:null})}});guardarD()}
